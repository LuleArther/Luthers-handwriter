services:
  handwriter:
    build: .
    container_name: handwriter
    restart: unless-stopped
    ports:
      - "8000:8000"
    mem_limit: 1g
    environment:
      HANDWRITER_DATA: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
